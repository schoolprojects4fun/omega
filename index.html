<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Omega</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://js.puter.com/v2/"></script>
<style>
/* Layout: left chat rail + centered conversation column with a pinned composer. */
:root{
  --bg:#f7f7f5; --panel:#eeeeeb; --surface:#ffffff; --ink:#1b1c20; --muted:#6b6c73;
  --line:#dcdcd6; --accent:#3b41d8; --accent-ink:#ffffff; --accent-soft:#e6e7fb;
  --code-bg:#15161a; --code-ink:#e6e6ea; --danger:#b3261e;
  --ui:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --display:"Newsreader",Georgia,"Times New Roman",serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --glyph:Georgia,"Times New Roman",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16171b; --panel:#1c1d22; --surface:#222328; --ink:#ecece8; --muted:#9a9ba3;
    --line:#32333a; --accent:#8b90ff; --accent-ink:#101024; --accent-soft:#2a2c4d;
    --code-bg:#0e0f12; --code-ink:#e6e6ea; --danger:#ff8a80; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16171b; --panel:#1c1d22; --surface:#222328; --ink:#ecece8; --muted:#9a9ba3;
  --line:#32333a; --accent:#8b90ff; --accent-ink:#101024; --accent-soft:#2a2c4d;
  --code-bg:#0e0f12; --code-ink:#e6e6ea; --danger:#ff8a80; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--ui);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:272px 1fr;height:100%}

/* rail */
.rail{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.brand{display:flex;align-items:center;gap:10px;padding:18px 16px 10px}
.mark{width:32px;height:32px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:600 20px/1 var(--glyph)}
.brand b{font:500 22px/1 var(--display);letter-spacing:.01em}
.new{margin:8px 12px;padding:9px 12px;border:1px solid var(--line);background:var(--surface);border-radius:10px;display:flex;align-items:center;gap:8px;font-weight:500}
.new:hover{border-color:var(--accent)}
.rail h3{margin:14px 16px 4px;font:500 11px/1 var(--ui);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.chats{flex:1;overflow-y:auto;padding:4px 8px 12px;min-height:0}
.chat{display:flex;align-items:center;gap:4px;border-radius:8px;padding:0 4px 0 10px}
.chat:hover,.chat.on{background:var(--surface)}
.chat button.open{flex:1;min-width:0;text-align:left;padding:8px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat .del{opacity:0;width:26px;height:26px;border-radius:6px;color:var(--muted)}
.chat:hover .del,.chat .del:focus-visible{opacity:1}
.chat .del:hover{color:var(--danger)}
.rail-foot{border-top:1px solid var(--line);padding:10px 12px;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px}
.theme{padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:13px}

/* main */
.main{display:flex;flex-direction:column;min-height:0;min-width:0;position:relative}
.top{display:none;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.burger{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center}
.scroll{flex:1;overflow-y:auto;min-height:0}
.col{max-width:760px;margin:0 auto;padding:28px 20px 12px}
.hello{text-align:center;padding:12vh 0 8px}
.hello .big{width:64px;height:64px;border-radius:18px;margin:0 auto 20px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:600 40px/1 var(--glyph)}
.hello h1{font:400 clamp(28px,4.4vw,40px)/1.15 var(--display);margin:0 0 8px;text-wrap:balance}
.hello p{margin:0;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:26px}
.chip{padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:14px}
.chip:hover{border-color:var(--accent);color:var(--accent)}

.msg{margin:0 0 26px}
.msg.user{display:flex;justify-content:flex-end}
.msg.user .bubble{background:var(--panel);border:1px solid var(--line);padding:10px 15px;border-radius:16px 16px 4px 16px;max-width:85%;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.ai{display:flex;gap:14px;align-items:flex-start}
.msg.ai .av{flex:none;width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:600 16px/1 var(--glyph);margin-top:2px}
.msg.ai .body{flex:1;min-width:0;overflow-wrap:anywhere}
.meta{font-size:12px;color:var(--muted);margin-top:6px}
.body p{margin:0 0 .85em}
.body h1,.body h2,.body h3,.body h4{font-family:var(--display);font-weight:500;line-height:1.25;margin:1.2em 0 .45em}
.body h1{font-size:1.6em}.body h2{font-size:1.38em}.body h3{font-size:1.18em}.body h4{font-size:1.05em}
.body ul,.body ol{margin:0 0 .9em;padding-left:1.4em}
.body li{margin:.2em 0}
.body blockquote{margin:0 0 .9em;padding:2px 0 2px 14px;border-left:3px solid var(--line);color:var(--muted)}
.body hr{border:0;border-top:1px solid var(--line);margin:1.2em 0}
.body a{color:var(--accent)}
.body code{font:13.5px var(--mono);background:var(--panel);padding:2px 6px;border-radius:5px}
.tablewrap{overflow-x:auto;margin:0 0 .9em}
.body table{border-collapse:collapse;font-size:14px;min-width:60%}
.body th,.body td{border:1px solid var(--line);padding:6px 10px;text-align:left}
.body th{background:var(--panel);font-weight:600}
.code{margin:0 0 1em;border-radius:10px;overflow:hidden;background:var(--code-bg)}
.code header{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 6px 14px;font:12px var(--mono);color:#9a9ba3;border-bottom:1px solid #2a2b31}
.code header button{color:#c8c8cf;padding:3px 9px;border-radius:6px;font:12px var(--ui)}
.code header button:hover{background:#2a2b31}
.code pre{margin:0;padding:14px;overflow-x:auto;color:var(--code-ink);font:13.5px/1.55 var(--mono)}
.code pre code{background:none;padding:0;color:inherit;font:inherit}
.think{margin:0 0 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.think summary{cursor:pointer;padding:8px 12px;font-size:13px;color:var(--muted);list-style:none;display:flex;align-items:center;gap:8px}
.think summary::-webkit-details-marker{display:none}
.think summary::before{content:"▸";transition:transform .15s}
.think[open] summary::before{transform:rotate(90deg)}
.think .t{padding:2px 14px 12px;font-size:13.5px;color:var(--muted);white-space:pre-wrap;max-height:260px;overflow:auto}
.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25;transform:scale(.7)}}
.err{color:var(--danger);font-size:14px;border:1px solid var(--danger);border-radius:10px;padding:10px 12px}

/* composer */
.dock{padding:6px 20px calc(14px + env(safe-area-inset-bottom,0px))}
.composer{max-width:760px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 12px 10px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px -12px rgba(0,0,0,.18)}
.composer:focus-within{border-color:var(--accent)}
.composer textarea{width:100%;border:0;outline:0;resize:none;background:none;color:var(--ink);font:inherit;max-height:220px;padding:2px 4px 8px;display:block}
.composer textarea::placeholder{color:var(--muted)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.effort{position:relative}
.eff-btn{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:10px;border:1px solid var(--line);font-size:13.5px;font-weight:500}
.eff-btn:hover{border-color:var(--accent)}
.bars{display:flex;align-items:flex-end;gap:2px;height:14px}
.bars i{width:3px;background:var(--line);border-radius:1px;display:block}
.bars i.on{background:var(--accent)}
.pop{position:absolute;bottom:calc(100% + 8px);left:0;width:min(340px,calc(100vw - 40px));background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 12px 40px -10px rgba(0,0,0,.3);z-index:20}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:9px 10px;border-radius:9px}
.opt:hover,.opt.on{background:var(--accent-soft)}
.opt .txt{flex:1;min-width:0}
.opt b{display:block;font-weight:600;font-size:14px}
.opt span{display:block;font-size:12.5px;color:var(--muted);line-height:1.35}
.opt em{font:11px var(--mono);color:var(--muted);font-style:normal}
.send{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.send:disabled{opacity:.35;cursor:default}
.send.stop{background:var(--ink);color:var(--bg)}
.fine{max-width:760px;margin:8px auto 0;text-align:center;font-size:12px;color:var(--muted)}

.scrim{display:none}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .rail{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:40;transform:translateX(-100%);transition:transform .2s}
  .rail.open{transform:none}
  .scrim.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30}
  .top{display:flex}
  .hello{padding-top:7vh}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="rail" id="rail" aria-label="Chats">
    <div class="brand"><div class="mark" aria-hidden="true">Ω</div><b>Omega</b></div>
    <button class="new" id="newChat"><span aria-hidden="true">＋</span> New chat</button>
    <h3>Recent</h3>
    <div class="chats" id="chatList"></div>
    <div class="rail-foot"><span>made by tiramisu.</span><button class="theme" id="themeBtn" aria-label="Change theme">Auto</button></div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main">
    <div class="top">
      <button class="burger" id="burger" aria-label="Open chats">☰</button>
      <div class="brand" style="padding:0"><div class="mark" style="width:26px;height:26px;font-size:16px" aria-hidden="true">Ω</div><b style="font-size:19px">Omega</b></div>
    </div>
    <div class="scroll" id="scroll"><div class="col" id="col"></div></div>
    <div class="dock">
      <form class="composer" id="form" autocomplete="off">
        <textarea id="input" rows="1" placeholder="Ask Omega anything" aria-label="Message Omega"></textarea>
        <div class="bar">
          <div class="effort">
            <button type="button" class="eff-btn" id="effBtn" aria-haspopup="listbox" aria-expanded="false">
              <span class="bars" id="effBars" aria-hidden="true"></span><span id="effName">High</span><span aria-hidden="true" style="color:var(--muted)">▾</span>
            </button>
            <div class="pop" id="effPop" role="listbox" aria-label="Effort" hidden></div>
          </div>
          <button type="submit" class="send" id="send" aria-label="Send message" disabled>↑</button>
        </div>
      </form>
      <p class="fine">Omega has no message limit of its own. Usage is billed to your Puter account.</p>
    </div>
  </main>
</div>

<script>
/* ---------- Effort levels ----------
   Model ids come from the Puter.js Claude tutorial. Ultra max runs two passes:
   a private planning pass, then a final answer that must check itself against the plan. */
const BASE = "You are Omega, an AI assistant. Be accurate, direct and useful. Format with Markdown when it helps. If asked which model powers you, say you run on Claude models through Puter.";
const LEVELS = [
  {id:"low",   name:"Low",       desc:"Fast and brief",                       model:"claude-haiku-5-5",  sys:"Answer directly and briefly. Skip preamble."},
  {id:"medium",name:"Medium",    desc:"Balanced for everyday questions",       model:"claude-sonnet-5-5", sys:"Give clear, accurate answers at a natural length."},
  {id:"high",  name:"High",      desc:"Works through it step by step",         model:"claude-sonnet-5-5", sys:"Think the problem through step by step before you answer. Check your work, then give a well organised answer."},
  {id:"extra", name:"Extra",     desc:"Stronger model, thorough answers",      model:"claude-opus-5-5",   sys:"Be thorough. Consider alternatives and edge cases, verify details, and explain your reasoning where it matters."},
  {id:"max",   name:"Max",       desc:"Most capable model, deep reasoning",    model:"claude-fable-5-1",  sys:"Reason deeply and carefully. Break the problem into parts, test your conclusions against every constraint, and only then answer."},
  {id:"ultra", name:"Ultra max", desc:"Most capable model with plan, then verify", model:"claude-fable-5-1", passes:2, sys:"Your final answer must be correct, complete and checked. Use the private notes to avoid every error they flag."}
];
const PLAN_SYS = BASE + "\n\nThis is a private planning pass. Do not write the final answer. Write working notes only: restate the task, list constraints, try two or more approaches, find likely mistakes and edge cases, and state the conclusion you will give. Be dense and specific.";

/* ---------- State ---------- */
const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let chats = store.get("omega.chats.v1", []);
let activeId = null;
let effort = store.get("omega.effort", "high");
let busy = false, abortCtl = null;
if(!LEVELS.some(l => l.id === effort)) effort = "high";

const level = () => LEVELS.find(l => l.id === effort);
const active = () => chats.find(c => c.id === activeId);
const save = () => store.set("omega.chats.v1", chats);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

/* ---------- Markdown ---------- */
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function inline(s){
  s = esc(s);
  s = s.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  s = s.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  return s;
}
function codeBlock(lang, code){
  code = code.replace(/\n$/, "");
  return '<div class="code"><header><span>' + esc(lang || "text") + '</span><button type="button" data-copy>Copy</button></header><pre><code>' + esc(code) + '</code></pre></div>';
}
function blocks(text){
  const L = text.split("\n"), out = []; let i = 0, para = [];
  const flush = () => { if(para.length){ out.push("<p>" + para.map(inline).join("<br>") + "</p>"); para = []; } };
  const isSep = l => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l || "");
  const cells = l => l.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(c => c.trim());
  while(i < L.length){
    const l = L[i]; let m;
    if(!l.trim()){ flush(); i++; continue; }
    if((m = l.match(/^(#{1,4})\s+(.*)$/))){ flush(); out.push("<h" + m[1].length + ">" + inline(m[2]) + "</h" + m[1].length + ">"); i++; continue; }
    if(/^\s*(-{3,}|\*{3,})\s*$/.test(l)){ flush(); out.push("<hr>"); i++; continue; }
    if(l.includes("|") && isSep(L[i+1])){
      flush(); const head = cells(l); i += 2; const rows = [];
      while(i < L.length && L[i].includes("|") && L[i].trim()){ rows.push(cells(L[i])); i++; }
      out.push('<div class="tablewrap"><table><thead><tr>' + head.map(c => "<th>" + inline(c) + "</th>").join("") + "</tr></thead><tbody>" +
        rows.map(r => "<tr>" + r.map(c => "<td>" + inline(c) + "</td>").join("") + "</tr>").join("") + "</tbody></table></div>");
      continue;
    }
    if(/^\s*[-*+]\s+/.test(l)){
      flush(); const it = [];
      while(i < L.length && /^\s*[-*+]\s+/.test(L[i])){ it.push(L[i].replace(/^\s*[-*+]\s+/, "")); i++; }
      out.push("<ul>" + it.map(x => "<li>" + inline(x) + "</li>").join("") + "</ul>"); continue;
    }
    if(/^\s*\d+[.)]\s+/.test(l)){
      flush(); const it = [];
      while(i < L.length && /^\s*\d+[.)]\s+/.test(L[i])){ it.push(L[i].replace(/^\s*\d+[.)]\s+/, "")); i++; }
      out.push("<ol>" + it.map(x => "<li>" + inline(x) + "</li>").join("") + "</ol>"); continue;
    }
    if(/^>\s?/.test(l)){
      flush(); const q = [];
      while(i < L.length && /^>\s?/.test(L[i])){ q.push(L[i].replace(/^>\s?/, "")); i++; }
      out.push("<blockquote>" + q.map(inline).join("<br>") + "</blockquote>"); continue;
    }
    para.push(l); i++;
  }
  flush(); return out.join("");
}
function md(src){
  const re = /```([\w+#.-]*)[ \t]*\n?([\s\S]*?)(```|$)/g; const parts = []; let last = 0, m;
  while((m = re.exec(src))){
    if(m.index > last) parts.push(blocks(src.slice(last, m.index)));
    parts.push(codeBlock(m[1], m[2])); last = re.lastIndex;
  }
  parts.push(blocks(src.slice(last)));
  return parts.join("");
}

/* ---------- Rendering ---------- */
function renderRail(){
  const box = $("chatList"); box.innerHTML = "";
  if(!chats.length){ const p = document.createElement("div"); p.style.cssText = "padding:8px 10px;color:var(--muted);font-size:13px"; p.textContent = "No chats yet"; box.appendChild(p); return; }
  chats.slice().sort((a,b) => b.t - a.t).forEach(c => {
    const row = document.createElement("div"); row.className = "chat" + (c.id === activeId ? " on" : "");
    const open = document.createElement("button"); open.className = "open"; open.textContent = c.title;
    open.onclick = () => { if(busy) return; activeId = c.id; closeRail(); renderAll(); };
    const del = document.createElement("button"); del.className = "del"; del.setAttribute("aria-label", "Delete chat"); del.textContent = "✕";
    del.onclick = () => { if(busy) return; chats = chats.filter(x => x.id !== c.id); if(activeId === c.id) activeId = null; save(); renderAll(); };
    row.append(open, del); box.appendChild(row);
  });
}
function hello(){
  return '<div class="hello"><div class="big" aria-hidden="true">Ω</div><h1>What are we working on?</h1><p>Pick an effort level below, then ask.</p>' +
    '<div class="chips">' +
    ["Explain how transformers work","Plan a week of meals under $60","Review my code for bugs","Write a cover letter for a design role"].map(t => '<button type="button" class="chip" data-prompt="' + esc(t) + '">' + esc(t) + '</button>').join("") +
    '</div></div>';
}
function msgHTML(m, idx){
  if(m.role === "user") return '<div class="msg user"><div class="bubble">' + esc(m.content) + '</div></div>';
  let h = '<div class="msg ai" data-i="' + idx + '"><div class="av" aria-hidden="true">Ω</div><div class="body">';
  if(m.think) h += '<details class="think"' + (m.thinking ? " open" : "") + '><summary>' + (m.thinking ? "Planning" : "Plan and checks") + '</summary><div class="t">' + esc(m.think) + '</div></details>';
  if(m.error) h += '<div class="err">' + esc(m.error) + '</div>';
  if(m.content) h += md(m.content);
  else if(!m.error) h += '<span class="pulse" aria-label="Thinking"></span>';
  if(m.meta && !m.pending) h += '<div class="meta">' + esc(m.meta) + '</div>';
  return h + '</div></div>';
}
function renderAll(){
  renderRail();
  const c = active(), col = $("col");
  col.innerHTML = (!c || !c.msgs.length) ? hello() : c.msgs.map(msgHTML).join("");
  $("scroll").scrollTop = $("scroll").scrollHeight;
}
let raf = 0;
function paintLast(){
  if(raf) return;
  raf = requestAnimationFrame(() => {
    raf = 0; const c = active(); if(!c) return;
    const i = c.msgs.length - 1, el = $("col").querySelector('.msg.ai[data-i="' + i + '"]');
    const sc = $("scroll"), near = sc.scrollHeight - sc.scrollTop - sc.clientHeight < 140;
    const tmp = document.createElement("div"); tmp.innerHTML = msgHTML(c.msgs[i], i);
    const next = tmp.firstElementChild;
    if(el){
      const wasOpen = el.querySelector(".think")?.open;
      el.replaceWith(next);
      const t = next.querySelector(".think"); if(t && wasOpen === false && !c.msgs[i].thinking) t.open = false;
    } else $("col").appendChild(next);
    if(near) sc.scrollTop = sc.scrollHeight;
  });
}

/* ---------- Effort picker ---------- */
function bars(n){ let h = ""; for(let i = 1; i <= 6; i++) h += '<i class="' + (i <= n ? "on" : "") + '" style="height:' + (4 + i * 1.7) + 'px"></i>'; return h; }
function renderEffort(){
  const idx = LEVELS.findIndex(l => l.id === effort) + 1;
  $("effBars").innerHTML = bars(idx); $("effName").textContent = level().name;
  $("effPop").innerHTML = LEVELS.map((l, i) =>
    '<button type="button" class="opt' + (l.id === effort ? " on" : "") + '" role="option" aria-selected="' + (l.id === effort) + '" data-eff="' + l.id + '">' +
    '<span class="bars" aria-hidden="true">' + bars(i + 1) + '</span><span class="txt"><b>' + l.name + '</b><span>' + l.desc + '</span></span><em>' + (l.passes ? "2 passes" : l.model.replace("claude-", "")) + '</em></button>').join("");
}
function togglePop(open){
  const pop = $("effPop"); const show = open ?? pop.hidden;
  pop.hidden = !show; $("effBtn").setAttribute("aria-expanded", String(show));
}

/* ---------- Puter streaming ---------- */
async function streamModel(model, messages, onText, onReason){
  if(typeof puter === "undefined" || !puter.ai) throw new Error("Puter.js did not load. Check your connection and that this page is served over http(s), then reload.");
  const resp = await puter.ai.chat(messages, { model, stream: true, signal: abortCtl.signal });
  for await (const part of resp){
    if(!part) continue;
    if(part.type === "error") throw new Error(part.message || "The model returned an error.");
    if(part.type === "reasoning"){ const r = part.reasoning ?? part.text; if(r) onReason && onReason(r); continue; }
    if(part.text && (!part.type || part.type === "text")) onText(part.text);
  }
}
async function respond(c){
  const lvl = level(), hist = c.msgs.slice(0, -1).filter(m => m.content).map(m => ({ role: m.role, content: m.content }));
  const a = c.msgs[c.msgs.length - 1]; const t0 = performance.now();
  try{
    let sys = BASE + "\n\n" + lvl.sys;
    if(lvl.passes === 2){
      a.thinking = true; a.think = ""; paintLast();
      await streamModel(lvl.model, [{ role: "system", content: PLAN_SYS }, ...hist], t => { a.think += t; paintLast(); }, t => { a.think += t; paintLast(); });
      a.thinking = false;
      sys += "\n\nPrivate notes from your planning pass (never quote or mention them):\n" + a.think.slice(0, 24000);
    }
    await streamModel(lvl.model, [{ role: "system", content: sys }, ...hist],
      t => { a.content += t; paintLast(); },
      t => { a.think = (a.think || "") + t; a.thinking = !a.content; paintLast(); });
    a.thinking = false;
  }catch(e){
    a.thinking = false;
    if(e && e.name === "AbortError"){ a.meta = "Stopped"; }
    else a.error = (e && (e.message || e.code)) ? String(e.message || e.code) : "Something went wrong. Try again.";
  }
  a.pending = false;
  if(!a.error && a.meta !== "Stopped") a.meta = lvl.name + " · " + (lvl.passes ? "2 passes · " : "") + lvl.model.replace("claude-", "") + " · " + ((performance.now() - t0) / 1000).toFixed(1) + "s";
  c.t = Date.now(); save(); busy = false; abortCtl = null; setSend(); paintLast();
}

/* ---------- Send ---------- */
function setSend(){
  const b = $("send"), has = $("input").value.trim().length > 0;
  b.classList.toggle("stop", busy); b.textContent = busy ? "■" : "↑";
  b.setAttribute("aria-label", busy ? "Stop" : "Send message"); b.disabled = !busy && !has;
}
function send(text){
  text = (text ?? $("input").value).trim(); if(!text || busy) return;
  let c = active();
  if(!c){ c = { id: uid(), title: text.slice(0, 44), t: Date.now(), msgs: [] }; chats.push(c); activeId = c.id; }
  c.msgs.push({ role: "user", content: text });
  c.msgs.push({ role: "assistant", content: "", pending: true });
  $("input").value = ""; autosize(); busy = true; abortCtl = new AbortController(); setSend();
  save(); renderAll(); respond(c);
}
function autosize(){ const t = $("input"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 220) + "px"; setSend(); }

/* ---------- Theme + rail ---------- */
const THEMES = ["auto", "light", "dark"]; let theme = store.get("omega.theme", "auto");
function applyTheme(){
  const r = document.documentElement; if(theme === "auto") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", theme);
  $("themeBtn").textContent = theme[0].toUpperCase() + theme.slice(1);
}
function openRail(){ $("rail").classList.add("open"); $("scrim").classList.add("show"); }
function closeRail(){ $("rail").classList.remove("open"); $("scrim").classList.remove("show"); }

/* ---------- Wiring ---------- */
$("form").addEventListener("submit", e => { e.preventDefault(); if(busy){ abortCtl && abortCtl.abort(); } else send(); });
$("input").addEventListener("input", autosize);
$("input").addEventListener("keydown", e => { if(e.key === "Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); if(!busy) send(); } });
$("newChat").onclick = () => { if(busy) return; activeId = null; closeRail(); renderAll(); $("input").focus(); };
$("burger").onclick = openRail; $("scrim").onclick = closeRail;
$("themeBtn").onclick = () => { theme = THEMES[(THEMES.indexOf(theme) + 1) % 3]; store.set("omega.theme", theme); applyTheme(); };
$("effBtn").onclick = e => { e.stopPropagation(); togglePop(); };
$("effPop").onclick = e => {
  const b = e.target.closest("[data-eff]"); if(!b) return;
  effort = b.dataset.eff; store.set("omega.effort", effort); renderEffort(); togglePop(false);
};
document.addEventListener("click", e => { if(!e.target.closest(".effort")) togglePop(false); });
document.addEventListener("keydown", e => { if(e.key === "Escape") togglePop(false); });
$("col").addEventListener("click", e => {
  const chip = e.target.closest("[data-prompt]"); if(chip){ send(chip.dataset.prompt); return; }
  const cp = e.target.closest("[data-copy]");
  if(cp){
    const code = cp.closest(".code").querySelector("code").textContent;
    const done = () => { cp.textContent = "Copied"; setTimeout(() => cp.textContent = "Copy", 1400); };
    if(navigator.clipboard) navigator.clipboard.writeText(code).then(done, () => {}); }
});

applyTheme(); renderEffort(); renderAll(); setSend();
</script>
</body>
